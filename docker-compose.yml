services:
  inpainting:
    build: .
    image: inpainting-sd15
    container_name: inpainting-sd15
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      - MODEL_ID=Nguyentruong031203/inpainting_1.5_stable_diffusion
      - LADO_MAX=512
    volumes:
      # Los ~4,4 GB del modelo se descargan una vez y se quedan aquí
      - hf-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

volumes:
  hf-cache:
    name: inpainting-hf-cache
